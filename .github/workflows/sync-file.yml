name: Sync Single File to Repo Root

on:
  schedule:
    # 每天 02:00 UTC = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download upstream file
        env:
          SOURCE_OWNER: PAICNI
          SOURCE_REPO: CFNext
          SOURCE_BRANCH: main
          SOURCE_PATH: 前后端分离版/CFNext-后端Worker版.js
          TARGET_PATH: /CFNext-后端Worker版.js   # ← 根目录
        run: |
          set -e
          TMP=$(mktemp -d)
          git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_OWNER/$SOURCE_REPO.git" "$TMP"

          if [ ! -f "$TMP/$SOURCE_PATH" ]; then
            echo "找不到文件: $SOURCE_PATH"
            find "$TMP" -maxdepth 3 -type f -print | head -n 200
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$TMP/$SOURCE_PATH" "$TARGET_PATH"
          echo "已复制 $SOURCE_PATH -> $TARGET_PATH"

          sha256sum "$TARGET_PATH" > "$TARGET_PATH.sha256"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$TARGET_PATH" "$TARGET_PATH.sha256"
          if git diff --cached --quiet; then
            echo "文件未变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: sync CFNext-前端Pages版.zip from PAICNI/CFNext@$SOURCE_BRANCH"
          git push
